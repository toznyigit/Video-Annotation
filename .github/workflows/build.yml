name: Build Standalone Executables & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        shell: cmd
        run: |
          pyinstaller --name="VideoAnnotator" --onefile --windowed --noconfirm --clean --add-data="USER_MANUAL.md;." --add-data="LICENSE;." --hidden-import="openpyxl" --hidden-import="openpyxl.styles" --hidden-import="PyQt6.QtMultimedia" --hidden-import="PyQt6.QtMultimediaWidgets" --collect-all="PyQt6" video_annotator.py
          cd dist
          copy ..\USER_MANUAL.md .\
          copy ..\LICENSE .\
          powershell -Command "Compress-Archive -Path 'VideoAnnotator.exe', 'USER_MANUAL.md', 'LICENSE' -DestinationPath 'VideoAnnotator-Windows.zip' -Force"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoAnnotator-Windows
          path: dist/VideoAnnotator-Windows.zip

  build-macos:
    name: Build macOS Standalone (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS Application
        run: |
          pyinstaller --name="VideoAnnotator" --windowed --noconfirm --clean --add-data="USER_MANUAL.md:." --add-data="LICENSE:." --hidden-import="openpyxl" --hidden-import="openpyxl.styles" --hidden-import="PyQt6.QtMultimedia" --hidden-import="PyQt6.QtMultimediaWidgets" --collect-all="PyQt6" video_annotator.py
          cd dist
          cp ../USER_MANUAL.md ./
          cp ../LICENSE ./
          zip -r -q "VideoAnnotator-macOS.zip" "VideoAnnotator.app" "USER_MANUAL.md" "LICENSE"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoAnnotator-macOS
          path: dist/VideoAnnotator-macOS.zip

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoAnnotator-Windows
          path: dist/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoAnnotator-macOS
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VideoAnnotator-Windows.zip
            dist/VideoAnnotator-macOS.zip
            USER_MANUAL.md
            LICENSE
          body: |
            ## Video Annotation Tool Release

            ### 📦 Standalone Downloads (No Python Required)
            - **Windows**: [VideoAnnotator-Windows.zip](dist/VideoAnnotator-Windows.zip) (Contains `VideoAnnotator.exe`)
            - **macOS**: [VideoAnnotator-macOS.zip](dist/VideoAnnotator-macOS.zip) (Contains `VideoAnnotator.app`)

            ### 📖 Documentation
            - Included in each download and available in repository: [USER_MANUAL.md](USER_MANUAL.md)
            - Distributed under the [GNU General Public License v3.0 (GPL-3.0)](LICENSE).
          draft: false
          prerelease: false
