name: Build Standalone Executables & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        shell: cmd
        run: |
          pyinstaller --name="VideoAnnotator" --onefile --windowed --noconfirm --clean --add-data="USER_MANUAL.md;." --add-data="LICENSE;." --hidden-import="openpyxl" --hidden-import="openpyxl.styles" --hidden-import="PyQt6.QtMultimedia" --hidden-import="PyQt6.QtMultimediaWidgets" --collect-all="PyQt6" video_annotator.py
          cd dist
          copy ..\USER_MANUAL.md .\
          copy ..\LICENSE .\
          powershell -Command "Compress-Archive -Path 'VideoAnnotator.exe', 'USER_MANUAL.md', 'LICENSE' -DestinationPath 'VideoAnnotator-Windows.zip' -Force"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoAnnotator-Windows
          path: dist/VideoAnnotator-Windows.zip

  build-macos:
    name: Build macOS Standalone (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS Application
        run: |
          pyinstaller --name="VideoAnnotator" --windowed --noconfirm --clean --add-data="USER_MANUAL.md:." --add-data="LICENSE:." --hidden-import="openpyxl" --hidden-import="openpyxl.styles" --hidden-import="PyQt6.QtMultimedia" --hidden-import="PyQt6.QtMultimediaWidgets" --collect-all="PyQt6" video_annotator.py
          cd dist
          cp ../USER_MANUAL.md ./
          cp ../LICENSE ./
          zip -r -q "VideoAnnotator-macOS.zip" "VideoAnnotator.app" "USER_MANUAL.md" "LICENSE"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoAnnotator-macOS
          path: dist/VideoAnnotator-macOS.zip

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${TAG}"

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoAnnotator-Windows
          path: dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoAnnotator-macOS
          path: dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Video Annotation Tool ${{ steps.vars.outputs.tag }}"
          files: |
            dist/VideoAnnotator-Windows.zip
            dist/VideoAnnotator-macOS.zip
            USER_MANUAL.md
            LICENSE
          body: |
            ## Video Annotation Tool Release (${{ steps.vars.outputs.tag }})

            ### 📦 Standalone Downloads (No Python Required)
            - **Windows**: Download `VideoAnnotator-Windows.zip` (unzip and double-click `VideoAnnotator.exe`)
            - **macOS**: Download `VideoAnnotator-macOS.zip` (unzip and open `VideoAnnotator.app`)

            ### 📖 Documentation
            - Read the included [USER_MANUAL.md](USER_MANUAL.md) for full setup and usage instructions.
            - Distributed under the [GNU General Public License v3.0 (GPL-3.0)](LICENSE).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
